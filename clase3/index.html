        <!-- Hanlderbars -->
        <script id="template" type="text/x-handlebars-template">
            <div class="container my-5">
                <div class="row">
                    <div class="col-md-4 p-3">
                        <h2 class="fw-bold">{{titulo1}}</h2>
                        <p class="fw-light">{{descripcion1}}</p>
                    </div>
                    <div class="col-md-4 p-3">
                        <h2 class="fw-bold">{{titulo2}}</h2>
                        <p class="fw-light">{{descripcion2}}</p>
                    </div>
                    <div class="col-md-4 p-3">
                        <h2 class="fw-bold">{{titulo3}}</h2>
                        <p class="fw-light">{{descripcion3}}</p>
                    </div>
                </div>
            </div>

            <div class="container my-5">
                <div class="row">
                    {{#if suscriptor.esPremium}}
                        <ul class="list-group">
                            {{#each noticias}}
                                <li class="list-group-item">
                                    <h2>{{this.titulo}}</h2>
                                    <p>{{this.descripcion}}</p>
                                </li>
                            {{/each}}
                        </ul>
                    {{else}}
                        <p>No tienes permisos para esta sección</p>
                    {{/if}}
                </div>
            </div>
        </script>
    </div>
